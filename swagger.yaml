  # ==========================================================================
  # CATEGORÍAS DE FAQ
  # ==========================================================================
  /api/faq-categories:
    post:
      tags: [Categorías FAQ]
      summary: Crear categoría de FAQ
      description: |
        Crea una nueva categoría de preguntas frecuentes para el bot del usuario autenticado.
 
        Las categorías se crean automáticamente al registrarse. Este endpoint permite crear categorías adicionales.
 
        Registra la acción en `RegistroActividad`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: "Envíos y logística"
            examples:
              nueva_categoria:
                value:
                  nombre: "Envíos y logística"
              otra_categoria:
                value:
                  nombre: "Garantías y devoluciones"
      responses:
        '201':
          description: Categoría creada con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Categoría creada con éxito."
                  categoria:
                    $ref: '#/components/schemas/CategoriaFAQ'
        '400':
          description: Error de validación Zod (el nombre está vacío o supera los 200 caracteres).
          content:
            application/json:
              example:
                success: false
                error: "Los datos enviados no son válidos"
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.
          content:
            application/json:
              example:
                success: false
                error: "Configuración de bot no encontrada."
 
    get:
      tags: [Categorías FAQ]
      summary: Listar categorías de FAQ
      description: |
        Devuelve todas las categorías del bot del usuario autenticado, ordenadas por fecha de creación descendente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              example:
                success: true
                categorias:
                  - id: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                    botId: "c8d1e2f3-4567-89ab-cdef-012345678901"
                    nombre: "Precios y pagos"
                    fechaCreacion: "2026-06-15T10:30:00.000Z"
                  - id: "e2d3c4b5-a6f7-8901-bcde-f01234567890"
                    botId: "c8d1e2f3-4567-89ab-cdef-012345678901"
                    nombre: "Envíos"
                    fechaCreacion: "2026-06-15T10:30:01.000Z"
        '401':
          description: No autenticado
        '404':
          description: Configuración de bot no encontrada.
 
  /api/faq-categories/{id}:
    put:
      tags: [Categorías FAQ]
      summary: Actualizar nombre de categoría
      description: |
        Renombra una categoría existente del bot del usuario autenticado.
 
        Registra la acción en `RegistroActividad`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la categoría a actualizar
          example: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "Medios de pago"
            example:
              nombre: "Medios de pago"
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              example:
                success: true
                message: "Categoría actualizada con éxito."
                categoria:
                  id: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                  botId: "c8d1e2f3-4567-89ab-cdef-012345678901"
                  nombre: "Medios de pago"
                  fechaCreacion: "2026-06-15T10:30:00.000Z"
        '400':
          description: ID de categoría inválido
        '401':
          description: No autenticado
        '404':
          description: Categoría no encontrada o no pertenece al bot del usuario
          content:
            application/json:
              example:
                success: false
                error: "La categoría no existe o no pertenece a tu bot."
 
    delete:
      tags: [Categorías FAQ]
      summary: Eliminar categoría
      description: |
        Elimina una categoría del bot del usuario autenticado.
 
        **Importante:** No se puede eliminar una categoría que tenga FAQs asociadas.
        El sistema devolverá `409 Conflict`. Es necesario eliminar o reasignar las FAQs primero.
 
        Registra la acción en `RegistroActividad`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la categoría a eliminar
          example: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
      responses:
        '200':
          description: Categoría eliminada
          content:
            application/json:
              example:
                success: true
                message: "Categoría eliminada con éxito."
        '400':
          description: El ID proporcionado no es un UUID válido.
        '401':
          description: No autenticado.
        '404':
          description: Bot no encontrado o la categoría no existe.
        '409':
          description: La categoría tiene FAQs asociadas y no puede eliminarse
          content:
            application/json:
              example:
                success: false
                error: "No se puede eliminar la categoría porque tiene preguntas frecuentes asociadas."
 
  # ==========================================================================
  # FAQs
  # ==========================================================================
  /api/faqs/suggestions:
    get:
      tags: [FAQs]
      summary: Obtener el catálogo oficial de FAQ sugeridas
      description: Devuelve las seis plantillas administradas por el backend.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo de sugerencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, pregunta, respuesta, categoria]
                      properties:
                        id:
                          type: string
                          example: "medios-pago"
                        pregunta:
                          type: string
                          example: "¿Qué medios de pago aceptan?"
                        respuesta:
                          type: string
                        categoria:
                          type: object
                          properties:
                            nombre:
                              type: string
                              example: "Precios y pagos"
        '401':
          description: No autenticado

  /api/faqs/from-suggestions:
    post:
      tags: [FAQs]
      summary: Crear FAQ reales desde sugerencias oficiales
      description: |
        Recibe únicamente IDs del catálogo. Crea o reutiliza las categorías del bot
        autenticado y omite de forma idempotente las preguntas que ya existen.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suggestionIds]
              properties:
                suggestionIds:
                  type: array
                  minItems: 1
                  maxItems: 6
                  uniqueItems: true
                  items:
                    type: string
                  example: ["medios-pago", "envios"]
      responses:
        '201':
          description: FAQ creadas; puede devolver una lista vacía si ya existían
        '400':
          description: Selección vacía o ID inexistente
        '401':
          description: No autenticado
        '404':
          description: Configuración de bot no encontrada

  /api/faqs:
    post:
      tags: [FAQs]
      summary: Crear una nueva FAQ
      description: |
        Crea una pregunta frecuente y la asigna a una categoría del bot del usuario.
 
        La categoría debe pertenecer al mismo bot — no se puede usar una categoría de otro usuario.
 
        Registra la acción en `RegistroActividad`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoriaId, pregunta, respuesta]
              properties:
                categoriaId:
                  type: string
                  format: uuid
                  description: ID de la categoría a la que pertenece esta FAQ (debe ser del mismo bot)
                  example: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                pregunta:
                  type: string
                  minLength: 5
                  maxLength: 500
                  example: "¿Realizan envíos al interior del país?"
                respuesta:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  example: "Sí, enviamos a todo el país mediante OCA y Andreani. El costo varía según la zona y lo calculamos juntos al momento de la compra."
            examples:
              faq_envios:
                summary: FAQ de envíos
                value:
                  categoriaId: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                  pregunta: "¿Realizan envíos al interior del país?"
                  respuesta: "Sí, enviamos a todo el país mediante OCA y Andreani. El costo varía según la zona."
              faq_pagos:
                summary: FAQ de medios de pago
                value:
                  categoriaId: "e2d3c4b5-a6f7-8901-bcde-f01234567890"
                  pregunta: "¿Qué medios de pago aceptan?"
                  respuesta: "Aceptamos transferencia bancaria, Mercado Pago (tarjetas, Mercado Crédito) y efectivo en punto de entrega."
      responses:
        '201':
          description: FAQ creada
          content:
            application/json:
              example:
                success: true
                message: "Pregunta creada con éxito."
                faq:
                  id: "d4e5f6a7-b8c9-0123-abcd-456789012345"
                  botId: "c8d1e2f3-4567-89ab-cdef-012345678901"
                  categoriaId: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                  pregunta: "¿Realizan envíos al interior del país?"
                  respuesta: "Sí, enviamos a todo el país mediante OCA y Andreani."
                  fechaCreacion: "2026-07-02T12:00:00.000Z"
                  fechaModificacion: "2026-07-02T12:00:00.000Z"
        '400':
          description: Validación fallida
        '401':
          description: No autenticado
        '404':
          description: Bot no encontrado o la categoría especificada no existe.
          content:
            application/json:
              example:
                success: false
                error: "La categoría especificada no existe o no pertenece a tu bot."
        '409':
          description: La pregunta ya existe en la base de datos para este bot.
          content:
            application/json:
              example:
                success: false
                error: "Esta pregunta ya existe en tu configuración."
 
    get:
      tags: [FAQs]
      summary: Listar FAQs con filtros y paginación
      description: |
        Devuelve las FAQs del bot del usuario autenticado.
 
        Soporta filtros combinables por categoría y búsqueda de texto.
 
        La paginación es obligatoria (con defaults de page=1 y limit=10).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
          description: Número de página
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
          description: Cantidad de FAQs por página (máximo 100)
        - in: query
          name: categoriaId
          schema:
            type: string
            format: uuid
          description: Filtrar por categoría específica
          example: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
        - in: query
          name: buscar
          schema:
            type: string
          description: Texto a buscar en pregunta y respuesta (case-insensitive)
          example: "envío"
      responses:
        '200':
          description: Lista paginada de FAQs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  faqs:
                    $ref: '#/components/schemas/PaginatedFAQs'
              example:
                success: true
                faqs:
                  faqs:
                    - id: "d4e5f6a7-b8c9-0123-abcd-456789012345"
                      botId: "c8d1e2f3-4567-89ab-cdef-012345678901"
                      categoriaId: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                      pregunta: "¿Realizan envíos al interior del país?"
                      respuesta: "Sí, enviamos a todo el país mediante OCA y Andreani."
                      fechaCreacion: "2026-07-02T12:00:00.000Z"
                      fechaModificacion: "2026-07-02T12:00:00.000Z"
                      categoria:
                        id: "f1e2d3c4-b5a6-7890-abcd-ef0123456789"
                        nombre: "Envíos"
                  total: 12
                  page: 1
                  limit: 10
                  totalPaginas: 2
        '401':
          description: No autenticado
 
  /api/faqs/{id}:
    put:
      tags: [FAQs]
      summary: Actualizar una FAQ
      description: |
        Actualiza una o más propiedades de una FAQ existente.
 
        Todos los campos del body son opcionales — solo se actualiza lo que se envía.
        Se debe enviar al menos un campo.
 
        Se puede reasignar la FAQ a otra categoría enviando un `categoriaId` diferente
        (la nueva categoría debe pertenecer al mismo bot).
 
        Registra la acción en `RegistroActividad`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la FAQ a actualizar
          example: "d4e5f6a7-b8c9-0123-abcd-456789012345"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoriaId:
                  type: string
                  format: uuid
                  description: Nueva categoría (opcional)
                pregunta:
                  type: string
                  minLength: 5
                  maxLength: 500
                respuesta:
                  type: string
                  minLength: 1
                  maxLength: 2000
            examples:
              actualizar_respuesta:
                summary: Solo actualizar la respuesta
                value:
                  respuesta: "Sí, enviamos a todo el país mediante OCA, Andreani y correo argentino. El costo varía según destino."
              mover_categoria:
                summary: Mover a otra categoría y actualizar pregunta
                value:
                  categoriaId: "e2d3c4b5-a6f7-8901-bcde-f01234567890"
                  pregunta: "¿Hacen envíos? ¿A qué zonas?"
      responses:
        '200':
          description: FAQ actualizada
          content:
            application/json:
              example:
                success: true
                message: "Pregunta actualizada con éxito."
                faq:
                  id: "d4e5f6a7-b8c9-0123-abcd-456789012345"
                  pregunta: "¿Realizan envíos al interior del país?"
                  respuesta: "Sí, enviamos a todo el país mediante OCA, Andreani y correo argentino."
        '400':
          description: ID inválido o body vacío
        '401':
          description: No autenticado
        '404':
          description: FAQ no encontrada o categoría de destino inválida
 
    delete:
      tags: [FAQs]
      summary: Eliminar una FAQ
      description: |
        Elimina permanentemente una FAQ del bot del usuario.
 
        Es un **hard delete** (eliminación real). No se puede recuperar.
 
        Registra la acción en `RegistroActividad`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la FAQ a eliminar
          example: "d4e5f6a7-b8c9-0123-abcd-456789012345"
      responses:
        '200':
          description: FAQ eliminada
          content:
            application/json:
              example:
                success: true
                message: "Pregunta eliminada con éxito."
        '401':
          description: No autenticado
        '404':
          description: FAQ no encontrada o ya eliminada
 
 # ==========================================================================
  # PRODUCTOS
  # ==========================================================================
  /api/products:
    post:
      tags: [Productos]
      summary: Crear un producto o servicio
      description: |
        Agrega un producto o servicio al catálogo del bot.
        Soporta `multipart/form-data` para procesar la subida de la imagen vía Cloudinary (máx. 5MB) o enviar una URL directa.
        
        **Regla de Precios (Zod):**
        Si `requiereCotizacion` es `false`, el campo `precio` es obligatorio y debe ser mayor a 0.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: "Instalación Eléctrica"
                descripcion:
                  type: string
                  maxLength: 2000
                requiereCotizacion:
                  type: boolean
                  default: false
                  description: "Si es true, el producto es 'A convenir'."
                precio:
                  type: number
                  minimum: 0
                  description: "Debe ser > 0 si requiereCotizacion es false."
                stock:
                  type: integer
                  minimum: 0
                  default: 0
                activo:
                  type: boolean
                  default: true
                imagen:
                  type: string
                  format: binary
                  description: Imagen del producto (JPG, PNG, WEBP — máx 5MB).
                urlImagen:
                  type: string
                  format: uri
                  description: "URL directa (alternativa a subir archivo binario)."
      responses:
        '201':
          description: Producto creado con éxito.
        '400':
          description: Validación fallida de Zod (ej. precio requerido y no enviado, o imagen demasiado pesada para multer).
          content:
            application/json:
              example:
                success: false
                error: "Si el producto no es 'A convenir', debes ingresar un precio mayor a 0"
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.

    get:
      tags: [Productos]
      summary: Listar productos con filtros y paginación
      description: |
        Devuelve el catálogo de productos del bot del usuario autenticado.
        Incluye defaults de paginación estrictos (page=1, limit=10, máximo limit=100).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: buscar
          schema:
            type: string
            description: Buscar por coincidencia parcial en nombre (case-insensitive).
        - in: query
          name: activo
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: Catálogo paginado obtenido exitosamente.
        '400':
          description: Error en parámetros de query (ej. limit mayor a 100).
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.

  /api/products/{id}:
    get:
      tags: [Productos]
      summary: Obtener un producto por ID
      description: Devuelve un producto específico mediante su ID (UUID válido).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Producto encontrado exitosamente.
        '400':
          description: El ID no tiene formato UUID.
        '401':
          description: No autenticado.
        '404':
          description: Producto no existe o no pertenece al catálogo del usuario.
          content:
            application/json:
              example:
                success: false
                error: "El producto no existe o no pertenece a tu catálogo."

    put:
      tags: [Productos]
      summary: Actualizar un producto
      description: |
        Actualiza los campos de un producto. Soporta `multipart/form-data` para reemplazar la imagen.
        Al menos un campo debe enviarse para evitar un error 400.
        **Regla de Negocio:** Lanza 400 `FIXED_PRICE_REQUIRED` si se quita `requiereCotizacion` y el precio guardado queda en 0.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre: 
                  type: string
                  minLength: 1
                  maxLength: 200
                descripcion: 
                  type: string
                  maxLength: 2000
                requiereCotizacion: 
                  type: boolean
                precio: 
                  type: number
                  minimum: 0
                  description: "No puede tener más de 2 decimales."
                stock: 
                  type: integer
                  minimum: 0
                activo: 
                  type: boolean
                imagen:
                  type: string
                  format: binary
                  description: "Nueva imagen (JPG/PNG/WEBP máx 5MB)."
      responses:
        '200':
          description: Producto actualizado con éxito.
        '400':
          description: Body vacío, error de validación Zod, o infracción de precio fijo.
          content:
            application/json:
              example:
                success: false
                error: "Los productos con precio fijo deben tener un precio mayor a 0."
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot o producto no encontrado.

    delete:
      tags: [Productos]
      summary: Eliminar un producto
      description: Elimina permanentemente un producto de la base de datos (Hard Delete).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Producto eliminado con éxito.
        '400':
          description: El ID no tiene formato UUID.
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot o producto no encontrado.
  # ==========================================================================
  # TELEMETRÍA
  # ==========================================================================
  /api/telemetry:
    post:
      tags: [Telemetría]
      summary: Registrar eventos de comportamiento del usuario
      description: |
        Ingesta de eventos de analítica del frontend.
 
        ## Comportamiento clave: fire-and-forget
        **Este endpoint siempre responde `200 OK`**, independientemente de si los eventos
        se encolaron correctamente en Redis. La telemetría nunca bloquea la experiencia del usuario.
 
        ## Autenticación: opcional
        - Si se envía token JWT válido, el `usuarioId` del usuario autenticado se asocia a los eventos.
        - Si no hay token (usuario anónimo), los eventos se registran con `usuarioId: "anonimo"`.
 
        ## Pipeline de datos
        ```
        POST /api/telemetry → Redis (lpush) → Worker (rpop cada 10s) → PostgreSQL (tabla eventos_telemetry)
        ```
 
        ## Rate limit específico
        60 requests por minuto por IP (más estricto que el límite general de la API).
 
        ## Casos de uso típicos
        - Registrar que un usuario visitó una página (PAGE_VIEW)
        - Registrar un clic en un botón (CLICK)
        - Registrar que el usuario interactuó con el chatbot (BOT_INTERACTION)
        - Registrar un error de JavaScript (ERROR)
        - Registrar el inicio/fin de una sesión (SESSION_START / SESSION_END)
 
        ## sessionId
        Identificador único de sesión del lado del cliente. Debe generarse una vez por
        sesión de navegador y mantenerse en `sessionStorage`. Formato libre (string hasta 200 chars).
        Ejemplo: `crypto.randomUUID()` en el frontend.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, eventos]
              properties:
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: |
                    Identificador único de sesión del cliente. Generarlo con `crypto.randomUUID()`
                    al inicio de la sesión y reutilizarlo en todos los requests de esa sesión.
                  example: "3f7a9c12-4e8b-4d2f-a901-bc45de678901"
                botId:
                  type: string
                  description: "ID del bot con el que se está interactuando (opcional)."
                tipoUsuario:
                  type: string
                  enum: [ANONIMO, EMPRENDEDOR, CLIENTE]
                eventos:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Uno o más eventos del batch. Máximo 100 por request.
                  items:
                    type: object
                    required: [tipoEvento]
                    properties:
                      tipoEvento:
                        type: string
                        minLength: 1
                        maxLength: 50
                        description: |
                          Tipo de evento. Valores sugeridos (no obligatorios):
                          PAGE_VIEW, CLICK, BOT_INTERACTION, ERROR, FORM_SUBMIT,
                          SESSION_START, SESSION_END, SCROLL, HOVER
                        example: "PAGE_VIEW"
                      pantallaActual:
                        type: string
                        maxLength: 200
                        description: Ruta o nombre de la pantalla actual
                        example: "/dashboard/faqs"
                      elemento:
                        type: string
                        maxLength: 100
                        description: Identificador del elemento con el que se interactuó
                        example: "btn-crear-faq"
                      metadata:
                        type: object
                        additionalProperties: true
                        description: Datos adicionales libres sobre el evento (JSON arbitrario)
                        example:
                          timeOnPage: 4500
                          scrollDepth: 75
            examples:
              usuario_anonimo_una_pagina:
                summary: "Usuario anónimo — vista de página + clic"
                description: "Caso típico de tracking sin login. Dos eventos en un solo request."
                value:
                  sessionId: "3f7a9c12-4e8b-4d2f-a901-bc45de678901"
                  eventos:
                    - tipoEvento: "PAGE_VIEW"
                      pantallaActual: "/landing"
                      metadata:
                        referrer: "https://google.com"
                        userAgent: "Mozilla/5.0"
                    - tipoEvento: "CLICK"
                      pantallaActual: "/landing"
                      elemento: "btn-registrarse"
                      metadata:
                        x: 540
                        y: 312
 
              usuario_autenticado_dashboard:
                summary: "Usuario autenticado — navegación en el dashboard"
                description: "El token JWT es opcional pero si se envía, el usuarioId se asocia al evento guardado en la base de datos."
                value:
                  sessionId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  eventos:
                    - tipoEvento: "PAGE_VIEW"
                      pantallaActual: "/dashboard/faqs"
                      metadata:
                        totalFaqs: 12
                        filtroActivo: "true"
                    - tipoEvento: "CLICK"
                      pantallaActual: "/dashboard/faqs"
                      elemento: "btn-crear-faq"
                      metadata:
                        x: 423
                        y: 156
 
              interaccion_bot:
                summary: "Interacción del cliente final con el chatbot"
                description: "Tracking de conversación en el widget del bot."
                value:
                  sessionId: "bot-sess-xyz789"
                  eventos:
                    - tipoEvento: "BOT_INTERACTION"
                      pantallaActual: "/chatbot-widget"
                      elemento: "chat-input"
                      metadata:
                        mensajeIndex: 1
                        intent: "consulta_precios"
                        respondioBot: true
                    - tipoEvento: "BOT_INTERACTION"
                      pantallaActual: "/chatbot-widget"
                      elemento: "btn-derivar-humano"
                      metadata:
                        mensajeIndex: 4
                        motivoDerivacion: "cliente_no_satisfecho"
 
              error_frontend:
                summary: "Error de JavaScript en el frontend"
                description: "Logging de errores de runtime para debugging."
                value:
                  sessionId: "err-sess-abc123"
                  eventos:
                    - tipoEvento: "ERROR"
                      pantallaActual: "/dashboard/productos"
                      elemento: "componente-carga-imagen"
                      metadata:
                        errorType: "TypeError"
                        errorMessage: "Cannot read properties of null"
                        stack: "TypeError: Cannot read properties of null\n  at ProductoForm.jsx:87"
                        severity: "high"
 
              sesion_completa:
                summary: "Batch completo: inicio y fin de sesión con múltiples interacciones"
                description: "Ejemplo de un batch con múltiples eventos enviados al cerrar la tab o al perder foco."
                value:
                  sessionId: "sess-completa-2026"
                  eventos:
                    - tipoEvento: "SESSION_START"
                      pantallaActual: "/dashboard"
                      metadata:
                        hora: "09:15:30"
                        timezone: "America/Buenos_Aires"
                    - tipoEvento: "PAGE_VIEW"
                      pantallaActual: "/dashboard"
                      metadata:
                        timeOnPage: 3200
                    - tipoEvento: "PAGE_VIEW"
                      pantallaActual: "/dashboard/bot"
                      metadata:
                        timeOnPage: 8900
                    - tipoEvento: "CLICK"
                      pantallaActual: "/dashboard/bot"
                      elemento: "toggle-bot-activo"
                      metadata:
                        nuevoEstado: true
                    - tipoEvento: "SESSION_END"
                      pantallaActual: "/dashboard/bot"
                      metadata:
                        totalTimeMs: 45300
                        paginasVisitadas: 2
      responses:
        '200':
          description: |
            Eventos recibidos y encolados en Redis.
            **Siempre devuelve 200**, incluso si Redis falla (best-effort).
          content:
            application/json:
              example:
                success: true
                message: "Eventos registrados"
        '400':
          description: |
            Validación del body fallida (sessionId vacío, array de eventos vacío, evento sin tipoEvento, etc.)
          content:
            application/json:
              examples:
                sin_session_id:
                  summary: sessionId faltante
                  value:
                    success: false
                    error: "Los datos enviados no son válidos"
                    detalles:
                      - campo: "sessionId"
                        mensaje: "El sessionId es obligatorio"
                array_vacio:
                  summary: Array de eventos vacío
                  value:
                    success: false
                    error: "Los datos enviados no son válidos"
                    detalles:
                      - campo: "eventos"
                        mensaje: "Debes enviar al menos un evento"
                tipo_evento_faltante:
                  summary: Evento sin tipoEvento
                  value:
                    success: false
                    error: "Los datos enviados no son válidos"
                    detalles:
                      - campo: "eventos.0.tipoEvento"
                        mensaje: "El tipo de evento es obligatorio"
        '429':
          description: Rate limit de telemetría excedido (60 req/min por IP)
          content:
            application/json:
              example:
                error: "Demasiados eventos detectados. Bloqueo temporal por seguridad."
  # ==========================================================================
  # API PÚBLICA (VISITANTES / CLIENTES DEL BOT)
  # ==========================================================================
  /api/public/chatbot/{slug}/init:
    get:
      tags: [API Pública]
      summary: Inicializar Chatbot
      description: |
        Endpoint que llama el widget del chat al abrirse por primera vez. 
        Devuelve la configuración estética del bot (colores, nombre) y gestiona el `sessionId`.
        **Validación Zod (superRefine):** Si se envía `hasHistory=true`, es **obligatorio** enviar el `sessionId`.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 1
          description: Enlace público del negocio.
        - in: query
          name: sessionId
          schema:
            type: string
          description: ID de sesión almacenado en el localStorage del cliente.
        - in: query
          name: hasHistory
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: Datos de inicialización obtenidos con éxito. Retorna un nuevo UUID si no había sesión previa.
          content:
            application/json:
              example:
                success: true
                data:
                  sessionId: "uuid-v4-generado"
                  hasHistory: false
                  botData:
                    botId: "uuid-del-bot"
                    nombre: "Mi Negocio"
                    colorPrimario: "#FF0000"
                    colorSecundario: "#00FF00"
        '400':
          description: Validación Zod fallida (ej. hasHistory=true pero falta sessionId).
          content:
            application/json:
              example:
                success: false
                error: "El sessionId es obligatorio para recuperar el historial de chat"
        '404':
          description: Bot no encontrado o se encuentra inactivo.
          content:
            application/json:
              example:
                success: false
                error: "Negocio o bot no encontrado."
        '429':
          description: Demasiadas solicitudes a la API (apiLimiter - Max 200 req/min).

  /api/public/chatbot/{slug}/products:
    get:
      tags: [API Pública]
      summary: Obtener catálogo público del bot
      description: Devuelve únicamente los productos que se encuentran activos (`activo: true`) para el bot correspondiente.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Lista de productos activos obtenida exitosamente.
        '404':
          description: Bot no encontrado o inactivo.
        '429':
          description: Demasiadas solicitudes a la API (apiLimiter - Max 200 req/min).

  /api/public/chatbot/{slug}/faqs:
    get:
      tags: [API Pública]
      summary: Obtener FAQs públicas del bot
      description: Devuelve todas las preguntas frecuentes existentes del bot, ordenadas alfabéticamente e incluyendo los datos de su categoría.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Lista de FAQs obtenida exitosamente.
        '400':
          description: El slug proporcionado está vacío.
        '404':
          description: Bot no encontrado o inactivo.
        '429':
          description: Demasiadas solicitudes a la API (apiLimiter - Max 200 req/min).

  /api/public/chatbot/{slug}/consultations:
    post:
      tags: [API Pública]
      summary: Crear una nueva consulta/lead desde el bot
      description: |
        Registra una nueva conversación iniciada por el visitante en el widget del chat.
        `tipoConsulta`, `asunto` y `descripcion` los fija el propio servidor (no son
        configurables desde el body) — el único identificador relevante que envía el
        cliente es `sessionId` (o `sessionAnonimaId` como *fallback* si todavía no lo tiene).
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  maxLength: 200
                sessionAnonimaId:
                  type: string
                  maxLength: 200
                  description: Fallback si sessionId no está definido.
                canal:
                  type: string
                  enum: [web, chatbot]
                  default: web
      responses:
        '201':
          description: Consulta creada con éxito.
        '404':
          description: Bot no encontrado o inactivo.

  /api/public/chatbot/{slug}/consultations/{id}/messages:
    post:
      tags: [API Pública]
      summary: Agregar mensaje del visitante a la consulta
      description: Guarda en la base de datos un mensaje enviado por el usuario o por el bot dentro de una consulta activa.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emisor, contenido]
              properties:
                emisor:
                  type: string
                  enum: [CLIENTE, EMPRENDEDOR, BOT]
                contenido:
                  type: string
                  minLength: 1
                  maxLength: 5000
                tipoMensaje:
                  type: string
                  enum: [TEXTO, ACCION, PRESUPUESTO]
                  description: Opcional.
      responses:
        '201':
          description: Mensaje agregado exitosamente.
        '400':
          description: Error de validación en el contenido.
        '404':
          description: Consulta no encontrada.

  /api/public/chatbot/{slug}/consultations/{id}/contact:
    patch:
      tags: [API Pública]
      summary: Capturar datos de contacto (Convertir a Lead)
      description: |
        Actualiza la consulta con los datos de contacto del visitante y la marca como `derivada: true`.
        **Validación Zod estricta:** Requiere nombre válido y teléfono numérico (8-15 dígitos).
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteNombre, clienteTelefono]
              properties:
                clienteNombre:
                  type: string
                  minLength: 1
                  maxLength: 150
                  description: "Regex: /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\\s]{2,50}$/"
                clienteTelefono:
                  type: string
                  minLength: 3
                  maxLength: 50
                  description: "Regex: /^\\+?[0-9]{8,15}$/"
      responses:
        '200':
          description: Contacto actualizado exitosamente.
        '400':
          description: El nombre o teléfono tienen un formato inválido.

  /api/public/chatbot/{slug}/consultations/{id}/budgets:
    post:
      tags: [API Pública]
      summary: Solicitar presupuesto desde el widget del bot
      description: |
        Crea un presupuesto a partir del carrito armado por el visitante durante la conversación.
        **Regla de negocio:** si alguno de los ítems corresponde a un producto con
        `requiereCotizacion: true`, el sistema no calcula un total automático — arma un
        presupuesto pendiente y `requiereCotizacionManual: true`, derivando la consulta a
        atención humana en vez de cerrar un precio.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 1
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la consulta sobre la que se solicita el presupuesto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productoId, cantidad]
                    properties:
                      productoId: { type: string, format: uuid }
                      cantidad: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Presupuesto creado (automático o pendiente de cotización manual, según el carrito).
          content:
            application/json:
              example:
                success: true
                requiereCotizacionManual: false
                total: 15400.5
        '400':
          description: Error de validación (ítems vacíos o `productoId`/`cantidad` inválidos).
        '404':
          description: Bot, consulta o alguno de los productos no encontrado.

  # ==========================================================================
  # MOTOR DEL CHATBOT
  # ==========================================================================
  /api/chatbot/chat:
    post:
      tags: [Chatbot Engine]
      summary: Procesar interacción con el bot
      description: |
        Motor principal del Chatbot. Gestiona el flujo de la conversación, la memoria de estados, validaciones de regex (nombres y teléfonos), creación de Leads y derivaciones. 
        **Regla de Negocio:** Si la sesión tiene estado `HUMANO_ATENDIENDO`, el bot se silencia y devuelve un mensaje de bloqueo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, botId]
              properties:
                accion:
                  type: string
                  minLength: 1
                  description: "Acción a ejecutar (ej. INICIO, MOSTRAR_CATALOGO, SOLICITAR_PRESUPUESTO, ENVIAR_DATOS). Opcional."
                sessionId:
                  type: string
                  minLength: 1
                botId:
                  type: string
                  minLength: 1
                contexto:
                  type: string
                  description: "Estado actual de la memoria conversacional (ej. ESPERANDO_NOMBRE_COTIZACION)."
                datosCliente:
                  type: object
                  description: "Estructura flexible que almacena inputs del usuario y carritos de compras temporales."
                  properties:
                    texto:
                      type: string
                    accion:
                      type: boolean
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          nombre:
                            type: string
                          cantidad:
                            type: integer
                          precio:
                            type: number
                          requiereCotizacion:
                            type: boolean
                    datosAcumulados:
                      type: object
                      additionalProperties: true
      responses:
        '200':
          description: Respuesta generada por el bot según el árbol de decisión.
          content:
            application/json:
              example:
                respuesta: "¡Excelente elección! Para poder armar tu presupuesto, por favor escribime tu *Nombre*."
                botones: []
                requiereInput: true
                contexto: "ESPERANDO_NOMBRE_PRESUPUESTO"
                datosAcumulados: 
                  carrito: 
                    - nombre: "Instalación"
                      cantidad: 1
                      precio: 5000
        '400':
          description: Error de validación Zod en el payload enviado.
        '429':
          description: Demasiadas solicitudes a la API (apiLimiter - Max 200 req/min).
        '500':
          description: Fallo crítico interno (ej. fallo al insertar el Lead o la Consulta en Prisma).
          content:
            application/json:
              example:
                error: "Fallo crítico: No se pudo obtener ni crear la consulta en la BD"
  
  
  /api/bot/slug:
    patch:
      tags: [Bot]
      summary: Actualizar enlace público (Slug) del bot
      description: |
        Personaliza la URL pública del bot. 
        **Importante:** Solo se puede modificar una vez. Si ya fue personalizado, devolverá un error 409 Conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: "Nuevo enlace público deseado"
      responses:
        '200':
          description: Enlace público actualizado con éxito.
        '400':
          description: Error de validación Zod (slug vacío o mayor a 100 caracteres).
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.
        '409':
          description: El enlace público ya fue personalizado y no puede volver a modificarse.
          content:
            application/json:
              example:
                success: false
                code: "SLUG_EDIT_ALREADY_USED"
                field: "slug"
                error: "El enlace público ya fue personalizado y no puede volver a modificarse."

  /api/bot/{slug}/status:
    patch:
      tags: [Bot]
      summary: Activar o desactivar bot públicamente
      description: Permite al emprendedor cambiar rápidamente el estado activo/inactivo de su bot utilizando el slug.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo:
                  type: boolean
                  description: Estado deseado del bot.
      responses:
        '200':
          description: Estado del bot actualizado exitosamente.
        '400':
          description: Error de validación (estado no es booleano o falta ID en params).
        '401':
          description: No autenticado.
        '404':
          description: Bot no encontrado.

  # ==========================================================================
  # MENSAJERÍA
  # ==========================================================================
  /api/mensajes/{slug}/{sessionId}:
    get:
      tags: [Mensajería]
      summary: Obtener historial de chat de una sesión
      description: |
        Devuelve la lista completa de mensajes intercambiados en una sesión específica, ordenados cronológicamente.
        También devuelve el estado actual del control del chat (`estadoChat`: BOT_ACTIVO | HUMANO_ATENDIENDO).
        **Seguridad:** Permite token opcional (`verificarTokenOpcional`).
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Historial de mensajes obtenido exitosamente.
          content:
            application/json:
              example:
                estadoChat: "BOT_ACTIVO"
                mensajes: 
                  - id: "uuid-mensaje"
                    emisor: "BOT"
                    contenido: "¡Hola! ¿En qué te ayudo?"
        '400':
          description: Falta el slug o sessionId.
        '500':
          description: Error interno al obtener los mensajes.

  # ==========================================================================
  # CONSULTAS Y LEADS (EMPRENDEDOR)
  # ==========================================================================
  /api/consultations:
    get:
      tags: [Consultas]
      summary: Listar todas las consultas
      description: Obtiene el listado completo de consultas y leads correspondientes al bot del emprendedor autenticado, ordenadas de más a menos reciente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de consultas obtenida.
        '401':
          description: No autenticado.

  /api/consultations/{id}:
    get:
      tags: [Consultas]
      summary: Obtener detalle de una consulta
      description: |
        Devuelve toda la información de una consulta específica, incluyendo todos sus mensajes anidados.
        **Efecto secundario:** si la consulta está `nueva`, se marca automáticamente como `en_proceso`.
        Si además tiene un presupuesto `PENDIENTE` vinculado, ese presupuesto también pasa a `EN_PROCESO`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la consulta obtenido.
        '404':
          description: Consulta no encontrada.

  /api/consultations/{id}/estado:
    patch:
      tags: [Consultas]
      summary: Actualizar el estado de la consulta
      description: |
        Cambia el estado de atención de la consulta (nueva, en_proceso, resuelta, cerrada).
        No incluye `iniciada` — ese estado nace solo, antes de que el cliente interactúe, y no se puede asignar manualmente.
        **Nota:** el bot atiende siempre (no hay traspaso de control a un humano), este cambio de estado es solo para la bandeja del emprendedor.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [nueva, en_proceso, resuelta, cerrada]
      responses:
        '200':
          description: Estado actualizado con éxito.
        '404':
          description: Consulta no encontrada.

  /api/consultations/{id}/mensajes:
    post:
      tags: [Consultas]
      summary: Enviar un mensaje manual (Emprendedor)
      description: Permite al dueño del negocio responder manualmente a un visitante dentro del hilo de una consulta.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contenido]
              properties:
                contenido:
                  type: string
                  description: "Texto de la respuesta (mínimo 1 caracter)."
      responses:
        '201':
          description: Mensaje del emprendedor guardado y enviado.
        '400':
          description: El contenido está vacío o no es texto.
        '404':
          description: Consulta no encontrada.

  /api/consultations/{id}/control-chat:
    patch:
      tags: [Consultas]
      summary: Tomar o liberar control del chat
      description: Modifica directamente la tabla `SesionChat` para definir si la sesión la está gestionando el `BOT_ACTIVO` o si hay un `HUMANO_ATENDIENDO`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [BOT_ACTIVO, HUMANO_ATENDIENDO]
      responses:
        '200':
          description: Control de chat actualizado.
        '404':
          description: Consulta no tiene un sessionId asociado.

  /api/consultations/{slug}/derivadas:
    get:
      tags: [Consultas]
      summary: Listar consultas derivadas (Bandeja de entrada)
      description: |
        Endpoint especial para la bandeja de entrada del emprendedor. Trae las consultas marcadas como `derivada: true` y permite filtrarlas por tipo.
        Incluye el estado actual de la sesión del chat para saber si el bot está silenciado o no.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: filtro
          schema:
            type: string
            enum: [atencion_personalizada, cotizaciones]
          description: Permite filtrar entre leads puros de atención y leads con carritos a cotizar.
      responses:
        '200':
          description: Listado de consultas derivadas obtenido con éxito.
        '500':
          description: Error interno al obtener las consultas.

# ==========================================================================
  # PRESUPUESTOS 
  # ==========================================================================
  /api/presupuestos:
    get:
      tags: [Presupuestos]
      summary: Listar y filtrar presupuestos
      description: |
        Devuelve una lista paginada de presupuestos correspondientes al bot del emprendedor.
        Permite filtrar por origen y por estado actual del presupuesto.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: origen
          schema:
            type: string
            enum: [EMPRENDEDOR, CHATBOT]
          description: Filtrar por el origen del presupuesto (quién lo generó).
        - in: query
          name: estado
          schema:
            type: string
            enum: [PENDIENTE, EN_PROCESO, ENVIADO, CONCRETADO, RECHAZADO]
          description: Filtrar por el estado del presupuesto.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Cantidad de resultados por página.
      responses:
        '200':
          description: Lista de presupuestos filtrada y paginada obtenida con éxito.
        '400':
          description: Error de validación en los parámetros de búsqueda.
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.

  /api/presupuestos/{id}:
    get:
      tags: [Presupuestos]
      summary: Obtener detalle de un presupuesto (con cambio automático a EN_PROCESO)
      description: |
        Devuelve la información detallada de un presupuesto mediante su ID. 
        **Regla de Negocio:** Si el estado actual del presupuesto es `PENDIENTE` y el emprendedor lo visualiza, pasará automáticamente al estado `EN_PROCESO`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^\d+$'
          description: ID numérico del presupuesto.
      responses:
        '200':
          description: Presupuesto obtenido exitosamente.
        '401':
          description: No autenticado.
        '404':
          description: Presupuesto no encontrado o no pertenece a tu bot.

  /api/presupuestos/{id}/estado:
    patch:
      tags: [Presupuestos]
      summary: Cambiar estado de un presupuesto manualmente
      description: |
        Permite al emprendedor forzar un cambio de estado en el presupuesto hacia cualquier estado válido del ciclo de vida.
        **Efectos secundarios sobre la consulta vinculada:** `CONCRETADO` → la consulta pasa a `RESUELTA`. `RECHAZADO` → la consulta pasa a `EN_PROCESO`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^\d+$'
          description: ID numérico del presupuesto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [PENDIENTE, EN_PROCESO, ENVIADO, CONCRETADO, RECHAZADO]
                  description: El nuevo estado que se le asignará al presupuesto.
      responses:
        '200':
          description: Estado del presupuesto actualizado exitosamente.
        '400':
          description: El estado enviado no es válido según los esquemas permitidos.
        '401':
          description: No autenticado.
        '404':
          description: Presupuesto no encontrado.

  /api/presupuestos/{id}/cotizar:
    put:
      tags: [Presupuestos]
      summary: Cotizar un presupuesto y generar el PDF formal
      description: |
        Permite al emprendedor ingresar los valores finales a los ítems de un presupuesto pendiente.
        
        **Lo que hace internamente:**
        1. Actualiza los valores en la base de datos y cambia el estado a `ENVIADO`.
        2. Genera un documento PDF con formato formal (colores, logo, tabla de precios) usando PDFKit.
        3. Sube el documento a Cloudinary.
        4. Borra el archivo local y guarda la URL segura en la base de datos.
        5. La consulta vinculada pasa automáticamente a `RESUELTA`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^\d+$'
          description: ID numérico del presupuesto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemsCotizados]
              properties:
                itemsCotizados:
                  type: array
                  minItems: 1
                  description: "Lista de ítems con sus precios definidos. Debe contener al menos un elemento."
                  items:
                    type: object
                    required: [nombre, cantidad, precioUnitario]
                    properties:
                      nombre:
                        type: string
                        minLength: 1
                        example: "Diseño de Marca"
                      cantidad:
                        type: number
                        exclusiveMinimum: 0
                        example: 1
                      precioUnitario:
                        type: number
                        minimum: 0
                        example: 45000.50
      responses:
        '200':
          description: Presupuesto cotizado, base de datos actualizada y PDF generado exitosamente en Cloudinary.
          content:
            application/json:
              example:
                mensaje: "Presupuesto cotizado, actualizado y PDF generado con éxito."
                rutaPdf: "https://res.cloudinary.com/micloud/image/upload/v1234/presupuestos_clientes/presupuesto_N123_Cliente_01-01-2026.pdf"
        '400':
          description: Error de validación Zod (ej. el ID no es numérico o un precio es negativo).
        '401':
          description: No autenticado o falta el token del emprendedor.
        '500':
          description: Error interno al generar el PDF mediante PDFKit o falló la subida a Cloudinary.

  # ==========================================================================
  # MÉTRICAS
  # ==========================================================================
  /api/metricas/dashboard:
    get:
      tags: [Métricas]
      summary: Resumen rápido para la pantalla principal del dashboard
      description: |
        Contadores livianos para la vista de inicio del panel del emprendedor
        (no incluye series de tiempo — para eso ver `/api/metricas/reportes`).
        `automatizacionEstimada` cuenta: consultas resueltas por timeout de 60 min sin
        interacción, MÁS presupuestos 100% automáticos del bot que el emprendedor todavía
        no abrió (dejan de contar apenas los abre, porque pasan a `EN_PROCESO`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen obtenido con éxito.
          content:
            application/json:
              example:
                consultasPendientes: 4
                presupuestosRegistrados: 12
                automatizacionEstimada:
                  porcentaje: 68
                  texto: "17 de 25 consultas fueron resueltas por el bot"
                consultasResueltas: 17
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.

  /api/metricas/reportes:
    get:
      tags: [Métricas]
      summary: Estadísticas completas para la sección de reportes/analítica
      description: |
        Incluye totales generales, tasa de conversión, estado de los presupuestos agrupados,
        y la evolución de los últimos 7 días (consultas y presupuestos por día). Los días se
        calculan en huso horario de Argentina (America/Argentina/Buenos_Aires), no en UTC.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadísticas obtenidas con éxito.
          content:
            application/json:
              example:
                resumenTotal:
                  conversaciones: 132
                  presupuestos: 40
                  ventasConcretadas: 18
                  tasaConversion: 14
                  derivadasAPersona: 22
                evolucionSemanal:
                  - dia: "Lun"
                    consultas: 9
                    presupuestos: 3
                  - dia: "Mar"
                    consultas: 12
                    presupuestos: 5
                estadoPresupuestos:
                  - estado: "Pendiente"
                    cantidad: 6
                  - estado: "Enviado"
                    cantidad: 16
                  - estado: "Concretado"
                    cantidad: 18
        '401':
          description: No autenticado.
        '404':
          description: Configuración de bot no encontrada.